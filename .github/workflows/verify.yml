name: Verify trajectory website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify real R model predictions
        run: python verify_model.py
      - name: Test prediction logic and Streamlit forms
        run: python -m unittest discover -s tests -v
